<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><title>人物样本库</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#202535;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:22px 18px 100px}h1{font-size:27px;margin:8px 0}h2{font-size:20px}p{color:#687184}.muted{color:#8992a3;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.card{background:white;border:1px solid #e9ebf2;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 3px 15px #20253506}.person{cursor:pointer}.avatar{height:46px;width:46px;display:grid;place-items:center;background:#e8edff;color:#4055bb;border-radius:15px;font-weight:700;font-size:19px;flex-shrink:0}.flex{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.title{font-weight:650;font-size:17px}.sub{font-size:13px;color:#8992a3;margin-top:5px}button{border:0;border-radius:12px;padding:12px 16px;background:#405ed8;color:white;font-size:15px;font-weight:600;cursor:pointer}button.secondary{background:#e9edfb;color:#4055bb}button.ghost{background:transparent;color:#52617c;padding:8px}button.danger{background:#fff0f0;color:#bd3c48}button:disabled{opacity:.5}input,textarea,select{width:100%;padding:12px;border:1px solid #e0e4ee;border-radius:11px;background:white;font:inherit;font-size:15px;color:#222}textarea{min-height:100px;resize:vertical}label{display:block;font-size:14px;font-weight:600;margin:17px 0 7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.empty{text-align:center;padding:45px 12px;color:#8b94a4}.empty strong{display:block;color:#566078;margin-bottom:8px}.pill{display:inline-block;border-radius:20px;background:#edf1fb;color:#5267a0;padding:5px 10px;font-size:12px}.record{border-left:3px solid #d8e1ff;padding-left:14px;margin:18px 0}.record p{white-space:pre-wrap;color:#343b4c;margin:7px 0 12px;font-size:14px;line-height:1.7}.record b{font-size:13px;color:#687184}.back{margin-bottom:14px}.sticky{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(10px);border-top:1px solid #e8eaf0;padding:12px max(18px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px}.sticky button{max-width:330px;flex:1}.hidden{display:none!important}.note{background:#fff9e8;padding:12px;border-radius:12px;font-size:13px;color:#8b6a2e;line-height:1.6}.topgap{margin-top:20px}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#303b52;color:white;padding:10px 18px;border-radius:22px;display:none;white-space:nowrap}
</style></head><body><main id="app"></main><div id="toast"></div><script>
const KEY='people_samples_v1';let db=load(),page='home',personId=null,recordId=null;function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return d&&Array.isArray(d.people)?d:{people:[]}}catch{return {people:[]}}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch{alert('保存失败：设备存储空间不足或浏览器禁止本地存储');return false}}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p,pid=null,rid=null){page=p;personId=pid;recordId=rid;render();window.scrollTo(0,0)}function person(){return db.people.find(x=>x.id===personId)}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}function today(){let d=new Date(),o=d.getTimezoneOffset()*60000;return new Date(d-o).toISOString().slice(0,10)}function render(){let a=document.getElementById('app');if(page==='home'){a.innerHTML=`<div class="row"><div><div class="muted">PERSONAL OBSERVATION</div><h1>人物样本库</h1><p>先记录事实，再慢慢形成判断。</p></div><span class="pill">${db.people.length} 人</span></div><input id="search" placeholder="🔍 搜索姓名、关系或备注" oninput="listPeople()"><div id="people"></div><div class="card topgap"><h2>数据与备份</h2><p class="muted">数据只保存在当前浏览器。建议每周导出一次，保存到「文件」App。</p><div class="actions"><button class="secondary" onclick="backup()">导出备份</button><button class="secondary" onclick="document.getElementById('importFile').click()">导入备份</button></div><input class="hidden" type="file" id="importFile" accept=".json,application/json" onchange="restore(event)"></div><div class="sticky"><button onclick="go('personForm')">＋ 新建人物</button><button class="secondary" onclick="quick()">快速记录</button></div>`;listPeople()}else if(page==='personForm'){let p=person()||{};a.innerHTML=`<button class="ghost back" onclick="go('${p.id?'detail':'home'}',${p.id?`'${p.id}'`:'null'})">← 返回</button><h1>${p.id?'编辑人物':'新建人物'}</h1><form id="form"><label>姓名或代称 *</label><input name="name" required maxlength="100" value="${esc(p.name||'')}" placeholder="例如：刘总"><label>关系</label><input name="relation" maxlength="100" value="${esc(p.relation||'')}" placeholder="例如：同事、朋友、家人"><label>人物画像（随时修改）</label><textarea name="portrait" placeholder="当前观察到的行为规律、信心程度、待验证的判断">${esc(p.portrait||'')}</textarea><label>其他备注</label><textarea name="notes" placeholder="基本信息、接触背景等（避免记录敏感隐私）">${esc(p.notes||'')}</textarea><div class="actions topgap"><button type="submit">保存人物</button>${p.id?'<button type="button" class="danger" onclick="deletePerson()">删除人物</button>':''}</div></form>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.name=v.name.trim();if(!v.name)return;if(p.id)Object.assign(p,v);else{p={id:id(),...v,records:[]};db.people.unshift(p)}if(save())go('detail',p.id)}}else if(page==='detail'){let p=person();if(!p)return go('home');let records=[...(p.records||[])].sort((a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created));a.innerHTML=`<button class="ghost back" onclick="go('home')">← 所有人物</button><div class="row"><div class="flex"><div class="avatar">${esc(p.name[0])}</div><div><h1 style="margin:0">${esc(p.name)}</h1><div class="sub">${esc(p.relation||'未设置关系')} · ${records.length} 条观察</div></div></div><button class="secondary" onclick="go('personForm','${p.id}')">编辑</button></div><div class="card"><div class="row"><h2>🧠 当前人物画像</h2><span class="pill">可修正</span></div><p style="white-space:pre-wrap;color:#343b4c;line-height:1.7">${esc(p.portrait||'暂无画像，可以在积累观察后再填写。')}</p>${p.notes?`<hr style="border:0;border-top:1px solid #eee"><p class="muted" style="white-space:pre-wrap">${esc(p.notes)}</p>`:''}</div><div class="row topgap"><h2>📝 行为观察</h2><span class="pill">${records.length} 条</span></div>${records.length?records.map(r=>`<div class="card"><div class="row"><span class="muted">${esc(r.date)}</span><button class="ghost" onclick="go('recordForm','${p.id}','${r.id}')">编辑</button></div>${[['事实',r.fact],['我的推测',r.inference],['竞争解释',r.alternative],['验证条件',r.verification]].filter(x=>x[1]).map(x=>`<div class="record"><b>${x[0]}</b><p>${esc(x[1])}</p></div>`).join('')}</div>`).join(''):'<div class="card empty"><strong>还没有观察记录</strong>看到具体行为时，先记下来就好。</div>'}<div class="sticky"><button onclick="go('recordForm','${p.id}')">＋ 添加观察</button></div>`}else if(page==='recordForm'){let p=person();if(!p)return go('home');let r=(p.records||[]).find(x=>x.id===recordId)||{};a.innerHTML=`<button class="ghost back" onclick="go('detail','${p.id}')">← ${esc(p.name)}</button><h1>${r.id?'编辑观察':'添加观察'}</h1><p>只填观察事实也可以，其他内容以后再补。</p><form id="form"><label>日期</label><input type="date" name="date" required value="${esc(r.date||today())}"><label>观察事实 *</label><textarea required name="fact" placeholder="对方说了什么、做了什么？尽量不掺入评价。">${esc(r.fact||'')}</textarea><label>我的推测（选填）</label><textarea name="inference" placeholder="这可能反映出什么规律？">${esc(r.inference||'')}</textarea><label>竞争解释（选填）</label><textarea name="alternative" placeholder="还有什么其他可能？">${esc(r.alternative||'')}</textarea><label>验证条件（选填）</label><textarea name="verification" placeholder="看到什么新证据，我会改变判断？">${esc(r.verification||'')}</textarea><div class="actions topgap"><button type="submit">保存观察</button>${r.id?'<button type="button" class="danger" onclick="deleteRecord()">删除记录</button>':''}</div></form>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.fact=v.fact.trim();if(!v.fact)return;if(r.id)Object.assign(r,v);else(p.records??=[]).push({id:id(),created:new Date().toISOString(),...v});if(save())go('detail',p.id)}}}function listPeople(){let q=document.getElementById('search').value.trim().toLowerCase();let ps=db.people.filter(p=>[p.name,p.relation,p.notes].some(x=>String(x||'').toLowerCase().includes(q)));document.getElementById('people').innerHTML=ps.length?ps.map(p=>`<div class="card person" onclick="go('detail','${p.id}')"><div class="flex"><div class="avatar">${esc(p.name[0])}</div><div class="grow"><div class="title">${esc(p.name)}</div><div class="sub">${esc(p.relation||'未设置关系')} · ${(p.records||[]).length} 条观察</div></div><span class="muted">›</span></div></div>`).join(''):`<div class="empty"><strong>${q?'没有匹配的人物':'还没有人物档案'}</strong>${q?'试试其他关键词':'点击下方「新建人物」开始记录'}</div>`}function quick(){if(!db.people.length)return go('personForm');let names=db.people.map((p,i)=>`${i+1}. ${p.name}`).join('\n');let n=prompt('选择人物序号：\n'+names);if(n===null)return;let p=db.people[Number(n)-1];if(!p)return toast('序号无效');go('recordForm',p.id)}function deletePerson(){if(confirm('确定删除这个人物及全部观察记录？此操作不可撤销。')){db.people=db.people.filter(p=>p.id!==personId);if(save())go('home')}}function deleteRecord(){if(confirm('确定删除这条观察记录？')){let p=person();p.records=p.records.filter(r=>r.id!==recordId);if(save())go('detail',p.id)}}function backup(){let data=JSON.stringify({format:'people-samples',version:1,exportedAt:new Date().toISOString(),people:db.people},null,2);let blob=new Blob([data],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='人物样本库备份-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('已生成备份文件')}async function restore(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.people)||d.people.some(p=>!p||typeof p.id!=='string'||typeof p.name!=='string'||!Array.isArray(p.records)))throw Error('格式不正确');if(!confirm(`将导入 ${d.people.length} 个人物，覆盖当前全部数据。建议先导出当前备份。是否继续？`))return;db={people:d.people};if(save()){go('home');toast('导入成功')}}catch(err){alert('导入失败：'+err.message)}finally{e.target.value=''}}render();
</script></body></html>
